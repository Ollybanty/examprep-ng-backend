openapi: 3.0.3
info:
  title: ExamPrep NG API
  version: 1.0.0
  description: |
    REST API for ExamPrep NG, a WAEC and JAMB exam practice platform.

    **Authentication:** most routes need a token. Get one from `/auth/verify-otp`, `/auth/login`
    or `/auth/accept-admin-invite`, then click **Authorize** and paste it (without "Bearer").

    **Responses:** success is `{ data }`, plus `message` when useful and `pagination` for lists.
    Errors are always `{ error: { code, message } }`. Validation errors also include `details`.

    Endpoints that aren't built yet return `501 NOT_IMPLEMENTED` and are not listed here yet.
    When you build an endpoint, add it to this file in the same PR.

servers:
  - url: /api/v1
    description: This server

tags:
  - name: Health
  - name: Auth
    description: Sign up, email verification, login and password reset
  - name: Profile
    description: The logged in user's own account
  - name: Sessions
    description: Practice sessions and CBT mocks (students only)
  - name: Analytics
    description: How a student is doing per topic (students only)
  - name: Admin users
    description: Teacher approval, admin invites and user management (admins only)

paths:
  /health:
    get:
      tags: [Health]
      summary: Check the server and database are up
      security: []
      responses:
        '200':
          description: Everything is up
          content:
            application/json:
              example:
                data: { status: ok, database: connected, time: '2026-11-24T10:00:00.000Z' }
        '503':
          description: The server is up but the database isn't connected
          content:
            application/json:
              example:
                data: { status: degraded, database: disconnected, time: '2026-11-24T10:00:00.000Z' }

  # ---------- Auth ----------

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account and email a 6 digit verification code
      description: |
        Role is `student` (default) or `teacher`. Nobody can register as admin.
        Teachers start as `pending` until an admin approves them.
        Phone is optional, must be Nigerian, and is saved as `+234...`.
        Rate limit: 10 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password]
              properties:
                full_name: { type: string, maxLength: 100, example: Ada Obi }
                email: { type: string, format: email, example: ada@example.com }
                password:
                  type: string
                  minLength: 8
                  description: At least 8 characters, with a letter and a number
                  example: Password1
                phone: { type: string, example: '08031234567' }
                role: { type: string, enum: [student, teacher], default: student }
      responses:
        '201':
          description: Account created, code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: Account created. Check your email for a 6-digit verification code,
                    }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Email or phone already used
          content:
            application/json:
              examples:
                email:
                  value:
                    {
                      error:
                        {
                          code: EMAIL_ALREADY_REGISTERED,
                          message: An account with this email already exists. Log in,
                          or request a new code if you have not verified it,
                        },
                    }
                phone:
                  value: { error: { code: DUPLICATE_VALUE, message: This phone is already in use } }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the email with the code, and get a login token
      description: |
        Codes last 10 minutes and allow 5 wrong tries. Each code works once.
        Rate limit: 10 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailAndCode' }
      responses:
        '200':
          description: Verified. Pending teachers get a message about admin approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Validation error, wrong code, or code expired or not found
          content:
            application/json:
              examples:
                wrong:
                  value:
                    { error: { code: OTP_INVALID, message: Incorrect code. 4 attempt(s) left } }
                expired:
                  value:
                    {
                      error:
                        {
                          code: OTP_EXPIRED,
                          message: This code has expired or was not found. Kindly request a new one,
                        },
                    }
        '409':
          description: Already verified
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: ALREADY_VERIFIED,
                      message: This account is already verified. Kindly log in instead,
                    },
                }
        '429':
          description: 5 wrong codes (the code is deleted), or too many requests
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: OTP_TOO_MANY_ATTEMPTS,
                      message: Too many wrong codes. Kindly request a new one,
                    },
                }

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Send a new verification code
      description: |
        Always gives the same reply, so it can't be used to check which emails are registered.
        A new code is only sent if the last one is more than 60 seconds old.
        Rate limit: 5 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnly' }
      responses:
        '200':
          description: Same reply every time
          content:
            application/json:
              example:
                {
                  message: If an unverified account exists for this email,
                  a new code has been sent,
                }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      description: |
        Pending teachers can log in; teacher only routes stay locked until an admin approves them.
        Rate limit: 10 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: student@test.local }
                password: { type: string, example: Password123! }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Wrong email or password (same message for both)
          content:
            application/json:
              example:
                { error: { code: INVALID_CREDENTIALS, message: Email or password is incorrect } }
        '403':
          description: Email not verified, or account disabled by an admin
          content:
            application/json:
              examples:
                unverified:
                  value:
                    {
                      error:
                        {
                          code: ACCOUNT_NOT_VERIFIED,
                          message: Kindly verify your email first. You can request a new code if yours has expired,
                        },
                    }
                disabled:
                  value:
                    {
                      error:
                        {
                          code: ACCOUNT_DISABLED,
                          message: This account has been disabled. Kindly contact support,
                        },
                    }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset code
      description: |
        Always gives the same reply. Disabled accounts get no code.
        Rate limit: 5 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnly' }
      responses:
        '200':
          description: Same reply every time
          content:
            application/json:
              example:
                {
                  message: If an account exists for this email,
                  a password reset code has been sent to it,
                }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with the reset code
      description: |
        Same code rules as verify-otp. Using a reset code also verifies the email.
        Rate limit: 10 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, new_password]
              properties:
                email: { type: string, format: email, example: ada@example.com }
                code: { type: string, pattern: '^\d{6}$', example: '123456' }
                new_password:
                  {
                    type: string,
                    minLength: 8,
                    description: At least 8 characters,
                    with a letter and a number,
                    example: NewPass99,
                  }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              example: { message: Password updated. Kindly log in with your new password }
        '400':
          description: Validation error, wrong code, or code expired or not found
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: OTP_EXPIRED,
                      message: This code has expired or was not found. Kindly request a new one,
                    },
                }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/accept-admin-invite:
    post:
      tags: [Auth]
      summary: Create an admin account from an invite link
      description: |
        The token comes from the invite email link (`/accept-invite?token=...`).
        Links last 48 hours and work once. Rate limit: 10 requests per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, full_name, password]
              properties:
                token:
                  {
                    type: string,
                    pattern: '^[a-f0-9]{64}$',
                    description: 64 character token from the invite link,
                  }
                full_name: { type: string, maxLength: 100, example: New Admin }
                password: { type: string, minLength: 8, example: Password1 }
      responses:
        '201':
          description: Admin account created and logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Validation error, or the link is wrong, expired or already used
          content:
            application/json:
              example:
                {
                  error:
                    { code: INVITE_INVALID, message: This invite link is invalid or has expired },
                }
        '409':
          description: Someone registered with this email after the invite was sent
          content:
            application/json:
              example:
                {
                  error:
                    { code: EMAIL_ALREADY_REGISTERED, message: This email already has an account },
                }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------- Profile ----------

  /users/me:
    get:
      tags: [Profile]
      summary: Get my profile
      responses:
        '200':
          description: The logged in user, with exam and subjects filled in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users/me/onboarding:
    patch:
      tags: [Profile]
      summary: Choose an exam and 4 to 6 subjects (students only)
      description: Can be called again later to change the exam or subjects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [exam_id, subject_ids]
              properties:
                exam_id: { $ref: '#/components/schemas/ObjectId' }
                subject_ids:
                  type: array
                  minItems: 4
                  maxItems: 6
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400':
          description: Validation error, or a subject isn't offered for that exam
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: INVALID_SUBJECTS,
                      message: One or more subjects are not offered for WAEC (WASSCE),
                    },
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Exam not found or not active
          content:
            application/json:
              example: { error: { code: EXAM_NOT_FOUND, message: This exam was not found } }

  /users/me/settings:
    patch:
      tags: [Profile]
      summary: Update my settings
      description: Only known settings are saved. Anything else in the body is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                focus_mode_enabled: { type: boolean, example: false }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400':
          description: Validation error, or no known setting was sent
          content:
            application/json:
              example:
                { error: { code: NO_SETTINGS, message: Send at least one setting to update } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------- Sessions ----------

  /sessions:
    post:
      tags: [Sessions]
      summary: Start a practice session or a CBT mock
      description: |
        **Practice:** pick how many questions (default 10, max 40) and optionally a topic, a year,
        or your weak topics. Free students get at most what's left of today's 15 questions.

        **CBT:** always the exam's own length and time (JAMB 40 questions in 30 minutes,
        WAEC 50 in 60). Free students get 1 mock a month. If a mock is already running,
        this returns it (200) instead of starting another.

        Questions come back in a random order, without answers or explanations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, exam_id, subject_id]
              properties:
                mode: { type: string, enum: [practice, cbt] }
                exam_id: { $ref: '#/components/schemas/ObjectId' }
                subject_id: { $ref: '#/components/schemas/ObjectId' }
                question_count:
                  {
                    type: integer,
                    minimum: 1,
                    maximum: 40,
                    default: 10,
                    description: Practice only,
                  }
                topic_id: { $ref: '#/components/schemas/ObjectId' }
                year: { type: integer, example: 2018, description: Practice only }
                weak_topics:
                  {
                    type: boolean,
                    description: 'Practice only: questions from your weak topics. Not together with topic_id',
                  }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '200':
          description: A CBT mock was already running, so that one is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400':
          description: Validation error, a topic from another subject, or topic and weak topics together
          content:
            application/json:
              example:
                { error: { code: INVALID_TOPIC, message: This topic is not part of Mathematics } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Not a student, or the free plan limit is reached
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: QUOTA_EXCEEDED,
                      message: 'Free plan: 15 practice questions a day. Come back tomorrow or upgrade to Pro',
                    },
                }
        '404':
          description: Exam or subject not found, or no questions match the filters
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: NO_QUESTIONS,
                      message: No questions match your choice yet. Try other filters,
                    },
                }
        '409':
          description: Not enough questions for a full mock, or no weak topics yet
          content:
            application/json:
              examples:
                mock:
                  value:
                    {
                      error:
                        {
                          code: NOT_ENOUGH_QUESTIONS,
                          message: 'A JAMB mock needs 40 questions, but Physics only has 8 so far',
                        },
                    }
                weak:
                  value:
                    {
                      error:
                        {
                          code: NO_WEAK_TOPICS,
                          message: "You have no weak topics in Mathematics yet. Keep practising and we'll find them",
                        },
                    }
        '501':
          description: Starting from a class assignment isn't built yet

  /sessions/{id}:
    get:
      tags: [Sessions]
      summary: Get a session, e.g. to carry on after a refresh
      description: |
        Returns the questions in the same order, the student's saved answers and flags,
        and `seconds_remaining` for a running mock. A mock whose time ran out is submitted first.
        Practice shows the correct answer for questions already answered. A mock never does here.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found, or it belongs to another student
          content:
            application/json:
              example: { error: { code: SESSION_NOT_FOUND, message: This session was not found } }

  /sessions/{id}/answer:
    patch:
      tags: [Sessions]
      summary: Save an answer
      description: |
        **Practice:** the answer is final, and the reply says whether it was right, with the
        explanation. Each first answer uses one of a free student's 15 daily questions.

        **CBT:** answers can be changed or cleared (`null`) until time runs out, and the
        reply is only `{ saved: true }`. Answers up to 5 seconds late are accepted.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id]
              properties:
                question_id: { $ref: '#/components/schemas/ObjectId' }
                selected_option:
                  {
                    type: string,
                    enum: [A, B, C, D],
                    nullable: true,
                    description: null clears a CBT answer,
                  }
                is_flagged_for_review: { type: boolean }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              examples:
                practice:
                  value:
                    {
                      data:
                        {
                          saved: true,
                          is_correct: false,
                          correct_option: B,
                          explanation_text: 'The total is 55, and 55 ÷ 5 = 11.',
                        },
                    }
                cbt:
                  value: { data: { saved: true } }
        '400':
          description: Validation error, nothing sent, question not in this session, or option not on this question
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: QUESTION_NOT_IN_SESSION,
                      message: This question is not part of this session,
                    },
                }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: Not a student, or no practice questions left today
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: QUOTA_EXCEEDED,
                      message: 'Free plan: 15 practice questions a day. Come back tomorrow or upgrade to Pro',
                    },
                }
        '404':
          description: Session not found
          content:
            application/json:
              example: { error: { code: SESSION_NOT_FOUND, message: This session was not found } }
        '409':
          description: Practice answer already given, time is up, or the session is finished
          content:
            application/json:
              examples:
                locked:
                  value:
                    { error: { code: ANSWER_LOCKED, message: You already answered this question } }
                expired:
                  value:
                    {
                      error:
                        {
                          code: SESSION_EXPIRED,
                          message: Time is up. Your mock has been submitted,
                        },
                    }
                finished:
                  value:
                    { error: { code: SESSION_FINISHED, message: This session is already finished } }

  /sessions/{id}/submit:
    post:
      tags: [Sessions]
      summary: Submit a session and get the score
      description: |
        Scores the session (+1 right, 0 wrong or skipped) and updates the student's topic mastery.

        Submitting a mock after its time ran out records it as `auto_submitted`.
        Submitting a session that's already finished (a double tap, or the timer got there first)
        returns the same result with a 200, not an error.

        Mocks nobody comes back to are also auto submitted by the server every minute.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The result
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Submitted }
                  data:
                    type: object
                    properties:
                      result: { $ref: '#/components/schemas/SessionResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found, or it belongs to another student
          content:
            application/json:
              example: { error: { code: SESSION_NOT_FOUND, message: This session was not found } }

  /sessions/{id}/review:
    get:
      tags: [Sessions]
      summary: Review a finished session with answers and explanations
      description: |
        Every question in the order the student saw it, with their answer, the correct answer,
        the explanation and an `outcome` (correct, wrong or skipped) for colours and filters.
        Only available once the session is finished. For a CBT mock, this is the only place
        answers are shown. A mock whose time ran out is submitted first.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The result and every question
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      result: { $ref: '#/components/schemas/SessionResult' }
                      questions:
                        type: array
                        items: { $ref: '#/components/schemas/ReviewQuestion' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Not found, or it belongs to another student
          content:
            application/json:
              example: { error: { code: SESSION_NOT_FOUND, message: This session was not found } }
        '409':
          description: The session is still running
          content:
            application/json:
              example:
                {
                  error:
                    {
                      code: SESSION_IN_PROGRESS,
                      message: Submit this session first to see the answers and explanations,
                    },
                }

  /sessions/history:
    get:
      tags: [Sessions]
      summary: My sessions, newest first
      description: |
        Score history over time. Running sessions are included too (status `in_progress`),
        so the app can offer to continue them. Mocks whose time ran out are submitted first.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [practice, cbt] }
        - name: subject_id
          in: query
          schema: { $ref: '#/components/schemas/ObjectId' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryItem' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------- Analytics ----------

  /analytics/mastery:
    get:
      tags: [Analytics]
      summary: Topic mastery and weak topics to practise next
      description: |
        Every topic in the student's chosen subjects (or one subject with `subject_id`), grouped by
        subject and sorted weak first. Topics not tried yet are `unrated` with 0 answers.

        Mastery uses the last 30 answers per topic, with newer answers counting more.
        Fewer than 5 answers is `unrated`, under 60% `weak`, 60 to 79% `developing`, 80% and up `strong`.

        `recommended_topics` lists up to 3 of the weakest weak topics. Start a practice session on one
        with `topic_id`, or on all weak topics with `weak_topics: true`.
      parameters:
        - name: subject_id
          in: query
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: Mastery per subject
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      subjects:
                        type: array
                        items:
                          type: object
                          properties:
                            subject: { $ref: '#/components/schemas/NameAndCode' }
                            summary:
                              type: object
                              example: { weak: 3, developing: 1, strong: 1, unrated: 13 }
                            topics:
                              type: array
                              items: { $ref: '#/components/schemas/MasteryTopic' }
                      recommended_topics:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/MasteryTopic'
                            - type: object
                              properties:
                                subject: { $ref: '#/components/schemas/NameAndCode' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Subject not found
          content:
            application/json:
              example: { error: { code: SUBJECT_NOT_FOUND, message: This subject was not found } }

  # ---------- Admin users ----------

  /admin/teachers:
    get:
      tags: [Admin users]
      summary: List teachers
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected] }
          description: Use `pending` to see teachers waiting for approval
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/teachers/{id}/approval:
    patch:
      tags: [Admin users]
      summary: Approve or reject a teacher
      description: Emails the teacher the result. An admin can change a decision later.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
      responses:
        '200':
          description: Decision saved and email sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No teacher with this id
          content:
            application/json:
              example: { error: { code: TEACHER_NOT_FOUND, message: This teacher was not found } }
        '409':
          description: The teacher already has this status
          content:
            application/json:
              example: { error: { code: NO_CHANGE, message: This teacher is already approved } }

  /admin/invites:
    post:
      tags: [Admin users]
      summary: Invite someone to become an admin
      description: |
        Emails a link to `FRONTEND_URL/accept-invite?token=...` that lasts 48 hours.
        Inviting the same email again replaces the old link.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailOnly' }
      responses:
        '201':
          description: Invite sent
          content:
            application/json:
              example:
                message: Invite sent
                data:
                  {
                    invite:
                      { email: new.admin@example.com, expires_at: '2026-11-26T10:00:00.000Z' },
                  }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: This email already has an account
          content:
            application/json:
              example:
                {
                  error:
                    { code: EMAIL_ALREADY_REGISTERED, message: This email already has an account },
                }

  /admin/users:
    get:
      tags: [Admin users]
      summary: List and search users
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [student, teacher, admin] }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: Matches name or email, ignoring case
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/users/{id}:
    patch:
      tags: [Admin users]
      summary: Turn an account on or off, or change its plan
      description: |
        A turned off user is logged out straight away. Admins can't turn off their own account.
        `plan_tier` lets us test Pro features before payments exist.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_active: { type: boolean, example: false }
                plan_tier: { type: string, enum: [free, pro] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400':
          description: Validation error, nothing to change, or trying to turn off your own account
          content:
            application/json:
              examples:
                nothing:
                  value:
                    { error: { code: NO_CHANGES, message: Send is_active or plan_tier to update } }
                self:
                  value:
                    {
                      error:
                        {
                          code: CANNOT_DEACTIVATE_SELF,
                          message: "You can't deactivate your own account",
                        },
                    }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No user with this id
          content:
            application/json:
              example: { error: { code: USER_NOT_FOUND, message: This user was not found } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      example: 6650f1a2b3c4d5e6f7a8b9c0

    NameAndCode:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string, example: Mathematics }
        code: { type: string, example: mathematics }

    User:
      type: object
      description: password_hash is never returned
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        full_name: { type: string, example: Ada Obi }
        email: { type: string, example: ada@example.com }
        phone: { type: string, example: '+2348031234567' }
        role: { type: string, enum: [student, teacher, admin] }
        teacher_status: { type: string, enum: [pending, approved, rejected], nullable: true }
        target_exam:
          description: An id, or name and code on profile routes. Null before onboarding.
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - $ref: '#/components/schemas/NameAndCode'
        selected_subjects:
          type: array
          description: Ids, or name and code on profile routes. Empty before onboarding.
          items:
            oneOf:
              - $ref: '#/components/schemas/ObjectId'
              - $ref: '#/components/schemas/NameAndCode'
        plan_tier: { type: string, enum: [free, pro] }
        is_verified: { type: boolean }
        focus_mode_enabled: { type: boolean }
        is_active: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            user: { $ref: '#/components/schemas/User' }

    TokenResponse:
      type: object
      properties:
        message: { type: string, example: Logged in successfully }
        data:
          type: object
          properties:
            token: { type: string, description: Paste this into Authorize }
            user: { $ref: '#/components/schemas/User' }

    EmailOnly:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, example: ada@example.com }

    EmailAndCode:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, example: ada@example.com }
        code: { type: string, pattern: '^\d{6}$', example: '123456' }

    SessionQuestion:
      type: object
      description: Answers and explanations are only included for answered practice questions
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        number: { type: integer, example: 3 }
        stem_text: { type: string, example: 'Solve for x: 3x + 5 = 20.' }
        options:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: A }
              text: { type: string, example: x = 5 }
        year: { type: integer, nullable: true, example: 2018 }
        topic: { $ref: '#/components/schemas/NameAndCode' }
        selected_option: { type: string, nullable: true, example: A }
        is_flagged_for_review: { type: boolean }
        is_correct: { type: boolean, description: Answered practice questions only }
        correct_option: { type: string, description: Answered practice questions only }
        explanation_text: { type: string, description: Answered practice questions only }

    Session:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        mode: { type: string, enum: [practice, cbt] }
        status: { type: string, enum: [in_progress, submitted, auto_submitted] }
        exam: { $ref: '#/components/schemas/ObjectId' }
        subject: { $ref: '#/components/schemas/ObjectId' }
        filters: { type: object }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true, description: CBT only }
        seconds_remaining:
          {
            type: integer,
            nullable: true,
            example: 1799,
            description: Running mocks only. Restart the countdown from this,
          }
        total_questions: { type: integer, example: 40 }
        answered_count: { type: integer, example: 12 }
        submitted_at: { type: string, format: date-time, description: Finished sessions only }
        raw_score: { type: integer, example: 24, description: Finished sessions only }
        percentage: { type: integer, example: 60, description: Finished sessions only }
        questions:
          type: array
          items: { $ref: '#/components/schemas/SessionQuestion' }

    SessionResult:
      type: object
      properties:
        session_id: { $ref: '#/components/schemas/ObjectId' }
        mode: { type: string, enum: [practice, cbt] }
        status: { type: string, enum: [submitted, auto_submitted] }
        submitted_at: { type: string, format: date-time }
        raw_score: { type: integer, example: 24 }
        total_questions: { type: integer, example: 30 }
        percentage: { type: integer, example: 80 }
        correct: { type: integer, example: 24 }
        wrong: { type: integer, example: 4 }
        skipped: { type: integer, example: 2, description: Never answered, or a cleared CBT answer }

    ReviewQuestion:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        number: { type: integer, example: 2 }
        stem_text: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: A }
              text: { type: string }
        year: { type: integer, nullable: true }
        topic: { $ref: '#/components/schemas/NameAndCode' }
        selected_option: { type: string, nullable: true, example: A }
        correct_option: { type: string, example: C }
        is_correct: { type: boolean }
        outcome: { type: string, enum: [correct, wrong, skipped] }
        is_flagged_for_review: { type: boolean }
        explanation_text: { type: string }

    HistoryItem:
      type: object
      properties:
        _id: { $ref: '#/components/schemas/ObjectId' }
        mode: { type: string, enum: [practice, cbt] }
        exam: { $ref: '#/components/schemas/NameAndCode' }
        subject: { $ref: '#/components/schemas/NameAndCode' }
        status: { type: string, enum: [in_progress, submitted, auto_submitted] }
        raw_score: { type: integer, nullable: true, example: 24 }
        total_questions: { type: integer, example: 30 }
        percentage: { type: integer, nullable: true, example: 80 }
        started_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }

    MasteryTopic:
      type: object
      properties:
        topic: { $ref: '#/components/schemas/NameAndCode' }
        status: { type: string, enum: [weak, developing, strong, unrated] }
        weighted_accuracy: { type: number, nullable: true, example: 73.3 }
        attempts_count: { type: integer, example: 5 }
        last_calculated_at: { type: string, format: date-time, nullable: true }

    SessionResponse:
      type: object
      properties:
        message: { type: string, example: Mock started }
        data:
          type: object
          properties:
            session: { $ref: '#/components/schemas/Session' }

    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
        pages: { type: integer, example: 3 }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              description: Only on VALIDATION_ERROR, one item per failed rule
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }

  responses:
    UserList:
      description: One page of users
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/User' }
              pagination: { $ref: '#/components/schemas/P' }
              []     